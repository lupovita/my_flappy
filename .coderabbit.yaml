# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: >-
  Prioritize correctness, accessibility, performance, and maintainable vanilla HTML,
  CSS, and JavaScript. Explain findings constructively and avoid stylistic nits.

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  review_details: false
  auto_review:
    enabled: true
    drafts: false
